# ==============================================================================
# Gusby Nginx Configuration — Android Termux
# ==============================================================================
# Copy to: $PREFIX/etc/nginx/conf.d/gusby.conf
# Include inside $PREFIX/etc/nginx/nginx.conf:
#   include /data/data/com.termux/files/usr/etc/nginx/conf.d/*.conf;
#
# Ports:
#   8080 -> Public/LAN ingress (terminates HTTP/Cloudflare Tunnel)
#   8081 -> Internal Go backend API loopback
# ==============================================================================

server {
    listen 8080;
    server_name localhost 127.0.0.1;

    client_max_body_size 12M;

    # Static Nuxt 4 SPA production output
    root /data/data/com.termux/files/home/services/gusby/frontend;
    index index.html;

    # Basic security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript image/svg+xml;

    # 1. API Reverse Proxy -> Go Backend (:8081)
    location /api/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout 90s;
        proxy_read_timeout 90s;
        proxy_buffering off;
    }

    # 2. Immutable Cache for Nuxt Bundled Assets
    location /_nuxt/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # 3. Prevent Caching of SPA Entrypoint (ensure new deploys are picked up immediately)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # 4. Static SPA Routing (fallback to index.html for client-side Vue router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 5. Deny hidden files (.env, .git, etc.)
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }
}
