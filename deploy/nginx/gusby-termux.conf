# ==============================================================================
# Gusby Nginx Configuration — Android Termux ARM64 Environment
# ==============================================================================
# Destination in Termux: $PREFIX/etc/nginx/conf.d/gusby.conf
# Include inside $PREFIX/etc/nginx/nginx.conf http {} block via:
#   include /data/data/com.termux/files/usr/etc/nginx/conf.d/*.conf;
#
# Topology:
#   Listening port: 8080 (Primary ingress behind Cloudflare Tunnel or local LAN)
#   Backend API:    http://127.0.0.1:8081 (Internal Go API & Queue Worker)
#   Static SPA:     $HOME/services/gusby/current/frontend/.output/public
#
# Testing before reload:
#   nginx -t
#   nginx -s reload
# ==============================================================================

server {
    listen 8080;
    server_name localhost 127.0.0.1;

    # Maximum payload size for document uploads (PDF, DOCX, TXT)
    client_max_body_size 12M;

    # Production Static Nuxt 4 SPA output directory
    root /data/data/com.termux/files/home/services/gusby/current/frontend/.output/public;
    index index.html;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Gzip Compression for low-bandwidth mobile connections
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss image/svg+xml;

    # --------------------------------------------------------------------------
    # 1. API Reverse Proxy -> Go Backend (:8081 on Loopback)
    # --------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;

        # Standard Forwarding Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Extended timeouts for LLM extraction and graph integration
        proxy_connect_timeout 10s;
        proxy_send_timeout 90s;
        proxy_read_timeout 90s;

        proxy_buffering off;
    }

    # --------------------------------------------------------------------------
    # 2. Immutable Cache for Bundled Static Assets
    # --------------------------------------------------------------------------
    location /_nuxt/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # --------------------------------------------------------------------------
    # 3. HTML SPA Entrypoint (Must revalidate to catch new releases)
    # --------------------------------------------------------------------------
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # --------------------------------------------------------------------------
    # 4. Static SPA Fallback Routing (Vue Router HTML5 History Mode)
    # --------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --------------------------------------------------------------------------
    # 5. Strict Block on Hidden & Sensitive Files (.env, .git, .bak, etc.)
    # --------------------------------------------------------------------------
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~* \.(env|git|bak|sql|tar|gz)$ {
        deny all;
        access_log off;
        log_not_found off;
    }
}
