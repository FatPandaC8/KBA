# ==============================================================================
# Gusby Prometheus Server Configuration
# ==============================================================================
# Minimal & Expanded Monitoring Profiles
# Default: Scrapes Gusby backend on loopback port 8081.
# If running remotely on Fedora dev machine: update targets to the Xperia host IP or SSH port forward.
# ==============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

rule_files:
  - "alerts.yml"

scrape_configs:
  # ----------------------------------------------------------------------------
  # 1. Gusby Go Application Metrics (HTTP API, Queue Worker, LLM, DB Pool)
  # ----------------------------------------------------------------------------
  - job_name: "gusby-app"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["127.0.0.1:8081"]
        labels:
          environment: "production"
          service: "gusby"
          host: "xperia-termux"

  # ----------------------------------------------------------------------------
  # 2. [Optional Expanded Profile] Host Node Exporter
  # ----------------------------------------------------------------------------
  # Uncomment if node_exporter is enabled on the host
  # - job_name: "node-exporter"
  #   static_configs:
  #     - targets: ["127.0.0.1:9100"]
  #       labels:
  #         host: "xperia-termux"
