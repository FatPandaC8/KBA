# Gusby Local Development Database (Postgres 16 in Docker on loopback)
# Development credentials only — match .env.example
services:
  postgres:
    image: postgres:16-alpine
    container_name: kba-postgres
    environment:
      POSTGRES_DB: echo_kb
      POSTGRES_USER: echo
      POSTGRES_PASSWORD: echo_dev_password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U echo -d echo_kb"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
