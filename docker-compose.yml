# Local development database. Postgres 16 in Docker, reachable on loopback only.
# Dev credentials only — match .env.example.
# Pipeline split (S2): no worker service, no job queue — the two synchronous
# APIs (POST /api/stt, POST /api/text-kb) run in the API process.
services:
  postgres:
    image: postgres:16-alpine
    container_name: kba-postgres
    environment:
      POSTGRES_DB: echo_kb
      POSTGRES_USER: echo
      POSTGRES_PASSWORD: echo_dev_password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U echo -d echo_kb"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
