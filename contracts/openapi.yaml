openapi: 3.1.0
info:
  title: Gusby API
  version: 1.0.0
  description: Gusby Text-to-Knowledge-Graph Platform REST API
servers:
  - url: http://127.0.0.1:8081/api
    description: Default Backend Direct API Server
  - url: /api
    description: Production Reverse Proxy (Nginx) Server

paths:
  /auth/signup:
    post:
      summary: Register new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
      responses:
        '201':
          description: User registered successfully
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'

  /auth/login:
    post:
      summary: Sign in user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: Sign in successful
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'

  /auth/logout:
    post:
      summary: Sign out current user
      responses:
        '200':
          description: Signed out successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean

  /auth/me:
    get:
      summary: Get current authenticated user
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'

  /documents/text:
    post:
      summary: Ingest plain text
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, content]
              properties:
                title:
                  type: string
                content:
                  type: string
                  maxLength: 50000
      responses:
        '202':
          description: Document accepted and queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'

  /documents/url:
    post:
      summary: Ingest public web URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url:
                  type: string
                  format: uri
      responses:
        '202':
          description: URL accepted and queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'

  /documents/file:
    post:
      summary: Ingest document file (TXT, PDF, DOCX)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                title:
                  type: string
      responses:
        '202':
          description: File accepted and queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'

  /documents:
    get:
      summary: List user documents
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [uploading, processing, completed, failed]
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  documents:
                    type: array
                    items:
                      $ref: '#/components/schemas/DocumentSummary'
                  total:
                    type: integer

  /documents/{id}:
    get:
      summary: Get document details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentDetail'
        '404':
          $ref: '#/components/responses/ErrorResponse'

  /graph:
    get:
      summary: Get Level-of-Detail graph projection
      parameters:
        - name: zoom
          in: query
          required: true
          schema:
            type: string
            enum: [far, medium, deep]
        - name: topic_id
          in: query
          schema:
            type: string
            format: uuid
        - name: concept_ids
          in: query
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GraphProjection'

  /graph/concept/{id}:
    get:
      summary: Get Concept details and connected propositions
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConceptDetail'

  /graph/proposition/{id}:
    get:
      summary: Get Proposition details and exact evidence spans
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PropositionDetail'

  /review/proposals:
    get:
      summary: List pending integration proposals
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  proposals:
                    type: array
                    items:
                      $ref: '#/components/schemas/IntegrationProposal'

  /review/proposals/{id}/resolve:
    post:
      summary: Approve or reject an integration proposal
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  enum: [approve, reject]
                notes:
                  type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean

  /review/conflicts:
    get:
      summary: List flagged proposition conflicts
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  conflicts:
                    type: array
                    items:
                      $ref: '#/components/schemas/PropositionConflict'

  /review/conflicts/{id}/resolve:
    post:
      summary: Resolve a proposition conflict
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resolution_choice, reason]
              properties:
                resolution_choice:
                  type: string
                  enum: [keep_both, override]
                reason:
                  type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean

  # ---------------------------------------------------------------------------
  # Admin API Endpoints (Single-Owner, RequireAdmin -> 404 for non-admins)
  # ---------------------------------------------------------------------------
  /admin/overview:
    get:
      summary: Admin Dashboard headline overview
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  ai:
                    type: object
                  pipeline:
                    type: object
                  users:
                    type: object
                  graph:
                    type: object
        '404':
          $ref: '#/components/responses/ErrorResponse'

  /admin/pipeline:
    get:
      summary: Pipeline and job queue health
      parameters:
        - name: stage
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
        - name: offset
          in: query
          schema:
            type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  stages:
                    type: object
                  latencies:
                    type: object
                  stuck_jobs:
                    type: array
                    items:
                      type: object
                  jobs:
                    type: array
                    items:
                      type: object
                  total:
                    type: integer

  /admin/pipeline/jobs/{id}/retry:
    post:
      summary: Retry a failed pipeline job
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  job_id:
                    type: string
                  status:
                    type: string
                  message:
                    type: string

  /admin/ai/health:
    get:
      summary: AI component health and provider description
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIHealthAndState'

  /admin/ai/metrics:
    get:
      summary: AI performance metrics and quality signals
      parameters:
        - name: window
          in: query
          schema:
            type: string
            enum: [1h, 24h, 7d]
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object

  /admin/ai/eval-runs:
    get:
      summary: Benchmark gold evaluation runs history
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  eval_runs:
                    type: array
                    items:
                      type: object

  /admin/ai/probe:
    post:
      summary: Execute active harmless AI health probe
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  latency_ms:
                    type: integer
                  http_status:
                    type: integer
                  tokens_consumed:
                    type: integer
                  probe_timestamp:
                    type: string

  /admin/ai/gate:
    get:
      summary: Get AI Gate and Circuit Breaker state
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  state:
                    type: string
                  reason:
                    type: string
                  consecutive_failures:
                    type: integer
                  updated_at:
                    type: string

  /admin/ai/gate/pause:
    post:
      summary: Pause AI processing gate
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object

  /admin/ai/gate/resume:
    post:
      summary: Resume AI processing gate
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object

  /admin/ai/gate/reset-breaker:
    post:
      summary: Reset circuit breaker to enabled
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object

  /admin/users:
    get:
      summary: List users with search and pagination
      parameters:
        - name: q
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [all, active, suspended]
        - name: limit
          in: query
          schema:
            type: integer
        - name: offset
          in: query
          schema:
            type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items:
                      type: object
                  total:
                    type: integer

  /admin/users/{id}:
    get:
      summary: Get user details and usage
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
    delete:
      summary: Hard delete user and cascading resources
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirmation]
              properties:
                confirmation:
                  type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object

  /admin/users/{id}/suspend:
    post:
      summary: Suspend user and revoke active sessions
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object

  /admin/users/{id}/unsuspend:
    post:
      summary: Unsuspend user account
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object

  /admin/users/{id}/reset-limits:
    post:
      summary: Reset token budget counters and lockout windows
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object

  /admin/documents:
    get:
      summary: List documents across users
      parameters:
        - name: user_id
          in: query
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
        - name: offset
          in: query
          schema:
            type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object

  /admin/documents/{id}:
    get:
      summary: Get document details and extraction runs
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
    delete:
      summary: Delete document and soft-retract unsupported propositions
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirmation]
              properties:
                confirmation:
                  type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object

  /admin/documents/{id}/reprocess:
    post:
      summary: Idempotently reprocess document with a new extraction run
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '202':
          content:
            application/json:
              schema:
                type: object

  /admin/graph/concepts:
    get:
      summary: List concepts for selected user
      parameters:
        - name: user_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: q
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
        - name: offset
          in: query
          schema:
            type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object

  /admin/graph/concepts/merge:
    post:
      summary: Merge two concepts with audit event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, source_concept_id, target_concept_id]
              properties:
                user_id:
                  type: string
                  format: uuid
                source_concept_id:
                  type: string
                  format: uuid
                target_concept_id:
                  type: string
                  format: uuid
                reason:
                  type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object

  /admin/graph/concepts/{id}:
    put:
      summary: Edit concept details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, name]
              properties:
                user_id:
                  type: string
                  format: uuid
                name:
                  type: string
                description:
                  type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
    delete:
      summary: Archive or delete concept
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: user_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object

  /admin/graph/propositions:
    get:
      summary: List propositions for selected user
      parameters:
        - name: user_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
        - name: offset
          in: query
          schema:
            type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
    post:
      summary: Manually create proposition with deterministic evidence validation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, subject_concept_id, predicate, object_concept_id, document_id, verbatim_quote]
              properties:
                user_id:
                  type: string
                  format: uuid
                subject_concept_id:
                  type: string
                  format: uuid
                predicate:
                  type: string
                object_concept_id:
                  type: string
                  format: uuid
                document_id:
                  type: string
                  format: uuid
                verbatim_quote:
                  type: string
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object

  /admin/graph/propositions/{id}/retract:
    post:
      summary: Soft-retract proposition
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id]
              properties:
                user_id:
                  type: string
                  format: uuid
                reason:
                  type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object

  /admin/graph/propositions/{id}/restore:
    post:
      summary: Restore retracted proposition
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id]
              properties:
                user_id:
                  type: string
                  format: uuid
                reason:
                  type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object

  /admin/graph/topics:
    get:
      summary: List topics for selected user
      parameters:
        - name: user_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object

  /admin/graph/topics/{id}:
    put:
      summary: Edit topic and mark user-locked
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, name]
              properties:
                user_id:
                  type: string
                  format: uuid
                name:
                  type: string
                description:
                  type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object

  /admin/graph/conflicts:
    get:
      summary: List conflicts needing review for selected user
      parameters:
        - name: user_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object

  /admin/graph/conflicts/{id}/resolve:
    post:
      summary: Resolve conflict with recorded decision
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, decision]
              properties:
                user_id:
                  type: string
                  format: uuid
                decision:
                  type: string
                  enum: [contextual_difference, contradiction, dismissed, insufficient_evidence]
                justification:
                  type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object

  /admin/audit:
    get:
      summary: Stream of append-only admin audit log events
      parameters:
        - name: action_type
          in: query
          schema:
            type: string
        - name: target_user_id
          in: query
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          schema:
            type: integer
        - name: offset
          in: query
          schema:
            type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  entries:
                    type: array
                    items:
                      type: object
                  total:
                    type: integer

components:
  responses:
    ErrorResponse:
      description: API Error
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error:
                type: object
                required: [code, message]
                properties:
                  code:
                    type: string
                  message:
                    type: string
                  details:
                    type: object

  schemas:
    AuthResponse:
      type: object
      required: [user]
      properties:
        user:
          type: object
          required: [id, email]
          properties:
            id:
              type: string
              format: uuid
            email:
              type: string

    IngestResponse:
      type: object
      required: [document_id, status, job_id]
      properties:
        document_id:
          type: string
          format: uuid
        status:
          type: string
        title:
          type: string
        job_id:
          type: string
          format: uuid

    DocumentSummary:
      type: object
      required: [id, title, source_type, status, created_at]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        source_type:
          type: string
        status:
          type: string
        char_count:
          type: integer
        concept_count:
          type: integer
        created_at:
          type: string
          format: date-time

    DocumentDetail:
      type: object
      required: [id, title, source_type, status, source_text, created_at]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        source_type:
          type: string
        status:
          type: string
        source_text:
          type: string
        char_count:
          type: integer
        created_at:
          type: string
          format: date-time

    GraphProjection:
      type: object
      required: [zoom, nodes, edges]
      properties:
        zoom:
          type: string
        nodes:
          type: array
          items:
            type: object
            required: [id, label, type]
            properties:
              id:
                type: string
              label:
                type: string
              type:
                type: string
                enum: [topic, concept]
              x:
                type: number
              y:
                type: number
              degree:
                type: integer
              needs_review:
                type: boolean
        edges:
          type: array
          items:
            type: object
            required: [id, source, target]
            properties:
              id:
                type: string
              source:
                type: string
              target:
                type: string
              label:
                type: string
              has_conflict:
                type: boolean

    ConceptDetail:
      type: object
      required: [id, name, aliases, degree, propositions]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        degree:
          type: integer
        aliases:
          type: array
          items:
            type: string
        topics:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
        propositions:
          type: array
          items:
            $ref: '#/components/schemas/PropositionDetail'

    PropositionDetail:
      type: object
      required: [id, subject, predicate, object, confidences, evidence]
      properties:
        id:
          type: string
          format: uuid
        subject:
          type: object
          properties:
            id:
              type: string
            name:
              type: string
        predicate:
          type: string
        object:
          type: object
          properties:
            id:
              type: string
            name:
              type: string
        confidences:
          type: object
          required: [extraction, evidence_validity, resolution, proposition]
          properties:
            extraction:
              type: number
            evidence_validity:
              type: number
            resolution:
              type: number
            proposition:
              type: number
        has_conflict:
          type: boolean
        evidence:
          type: array
          items:
            type: object
            required: [id, document_id, quote, char_start, char_end]
            properties:
              id:
                type: string
              document_id:
                type: string
              document_title:
                type: string
              quote:
                type: string
              char_start:
                type: integer
              char_end:
                type: integer

    IntegrationProposal:
      type: object
      required: [id, item_type, status, confidences, payload]
      properties:
        id:
          type: string
          format: uuid
        item_type:
          type: string
        status:
          type: string
        confidences:
          type: object
        payload:
          type: object

    PropositionConflict:
      type: object
      required: [id, conflict_type, status, canonical_proposition, conflicting_proposition]
      properties:
        id:
          type: string
          format: uuid
        conflict_type:
          type: string
        status:
          type: string
        canonical_proposition:
          $ref: '#/components/schemas/PropositionDetail'
        conflicting_proposition:
          $ref: '#/components/schemas/PropositionDetail'

    AIHealthAndState:
      type: object
      required: [status, reason, latency_ms, provider, gate, details]
      properties:
        status:
          type: string
          enum: [healthy, degraded, down, paused, unknown]
        reason:
          type: string
        latency_ms:
          type: integer
        provider:
          type: object
          required: [kind, model, version, is_configured, capabilities]
          properties:
            kind:
              type: string
            model:
              type: string
            version:
              type: string
            is_configured:
              type: boolean
            capabilities:
              type: array
              items:
                type: string
            rpm_limit:
              type: integer
            tpm_limit:
              type: integer
        gate:
          type: object
          required: [state, reason, consecutive_failures, updated_at]
          properties:
            state:
              type: string
              enum: [enabled, paused, circuit_open, half_open]
            reason:
              type: string
            consecutive_failures:
              type: integer
            updated_at:
              type: string
              format: date-time
        details:
          type: object
          description: Generic key-value telemetry for current provider and future model
          additionalProperties: true
